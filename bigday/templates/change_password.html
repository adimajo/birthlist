{% extends "base.html" %}

{% block page_content %}

{% load crispy_forms_tags %}

<!--Register--> 
<div class="container py-5">
	<h1>Changer un mot de passe</h1>
	<form method="POST">
		{% csrf_token %}
		{{ changepass_form|crispy }}
		<button class="btn btn-primary" type="submit">Enregistrer</button>
	</form>
	<p class="text-center">Si vous avez déjà un compte, <a href="/login">connectez-vous</a>.</p>
</div>

{% endblock %}
